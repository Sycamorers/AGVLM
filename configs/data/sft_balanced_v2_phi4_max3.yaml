    - target.canonical_label
  consultation:
    - source_dataset
    - metadata.crop
    - metadata.disease
  clarify_or_respond:
    - source_dataset
    - target.decision
min_per_stratum_by_task:
  vqa: 1
  classification: 1
  consultation: 1
  clarify_or_respond: 1
