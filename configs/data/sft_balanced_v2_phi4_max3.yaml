input_manifest_path: data/manifests/full/sft_train_phi4_max3_no_eval_overlap.jsonl
output_manifest_path: data/manifests/full/sft_train_phi4_max3_balanced_v2_instructional.jsonl
summary_output_path: data/manifests/full/sft_train_phi4_max3_balanced_v2_instructional_summary.json
seed: 41
shuffle: true
task_targets:
  vqa: 63000
  classification: 54000
  consultation: 36000
  clarify_or_respond: 27000
stratify_fields_by_task:
