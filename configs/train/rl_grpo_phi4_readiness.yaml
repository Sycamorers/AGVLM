# Stage-2 Phi-4 RL readiness dry-run. This does not load the large model.
sft_checkpoint_path: /orange/hmedeiros/qinruoyao/agvlm/outputs/sft/phi4-reasoning-vision-15b-full-max3-turin-16gpu-batch1
manifest_path: data/manifests/full/rl_manifest.jsonl
eval_manifest_path: data/manifests/full/rl_local_holdout_eval.jsonl
output_dir: outputs/rl/readiness/grpo-phi4-reasoning-vision-15b
checkpoint_output_dir: /orange/hmedeiros/qinruoyao/agvlm/outputs/rl/readiness/grpo-phi4-reasoning-vision-15b
seed: 41
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
num_train_epochs: 1
max_steps: -1
learning_rate: 3.0e-6
weight_decay: 0.0
warmup_ratio: 0.03
max_grad_norm: 1.0
logging_steps: 1
save_steps: 50
save_total_limit: 1
bf16: true
gradient_checkpointing: true
use_peft: true
report_to:
  - tensorboard
run_name: grpo-phi4-reasoning-vision-15b-readiness
dry_run: true
smoke_max_samples: 8
resume_from_checkpoint: auto
dataloader_num_workers: 0
dataloader_pin_memory: true
dataloader_persistent_workers: false
ddp_find_unused_parameters: false
ddp_timeout: 3600
log_on_each_node: false
save_on_each_node: false
full_determinism: false
tf32: true
beta: 0.0
num_generations: 2
max_prompt_length: 2048
max_completion_length: 128
loss_type: grpo
scale_rewards: group
use_vllm: false
vllm_mode: colocate
reward_modules:
  - exact_match
  - normalized_label
  - synonym_match
  - structured_format
  - uncertainty_calibration
  - clarify_vs_respond
  - management_coverage
  - hallucination_penalty
reward_weights:
  exact_match: 1.0
  normalized_label: 1.0
  synonym_match: 0.5
  structured_format: 0.5
  uncertainty_calibration: 0.5
  clarify_vs_respond: 1.0
  management_coverage: 0.5
  hallucination_penalty: 1.0
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  bias: none
  target_modules:
    - qkv_proj
    - o_proj
    - gate_up_proj
    - down_proj
